name: Release

# Publishes to npm when a version tag is pushed, through npm trusted
# publishing (OIDC): no npm token is stored anywhere, and the package gets a
# provenance statement linking it to this workflow run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --access public
